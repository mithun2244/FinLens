# CI for FinLens — Multimodal AI Financial Assistant.
#
# Three jobs so a red X says which part broke:
#   quality  — ruff + mypy over the Python source. Seconds, no model downloads.
#   test     — the offline pytest suite against real pdfplumber/Chroma, with the
#              embedding endpoint stubbed by tests/conftest.py.
#   frontend — eslint + next build for the Next.js app in frontend/.
#
# The jobs are independent and run in parallel; a TypeScript error must not be reported
# as a Python failure, or vice versa.
#
# The suite is free and offline by design (rules.md Rule 1): integration tests that hit
# the live Groq API are excluded by pytest.ini's `-m "not integration"`, so CI never
# spends the free-tier token budget and never needs a real credential.

name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# A newer push makes an in-flight run obsolete; don't burn runner minutes on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `import src` must resolve from the repo root. pytest.ini also sets `pythonpath = .`,
  # which is the real fix; this covers any step that invokes Python directly.
  PYTHONPATH: .
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  quality:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Deliberately does NOT install requirements.txt. ruff and mypy need only the
      # source tree, so this job stays fast and independent of the heavy ML stack.
      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      # flake8 was replaced by ruff: it is already a declared dev dependency, it is
      # substantially faster, and it enforces the same error classes. The old workflow's
      # second flake8 pass used --exit-zero, so it could never fail a build — it was
      # decorative. This one is real, but scoped to correctness rules, not style.
      - name: Lint with ruff
        run: ruff check src app.py ui scripts tests --select E9,F63,F7,F82,F401,F811

      # The project is fully type-annotated (rules.md Rule 2.2), so this is a genuine
      # gate. --ignore-missing-imports because several ML dependencies ship no stubs.
      - name: Type-check with mypy
        run: mypy src app.py ui --ignore-missing-imports

  test:
    name: Offline test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # requirements-dev.txt is required, not optional: pytest lives there. The runtime
      # requirements.txt was trimmed to what the API imports so the 512 MB deployment does
      # not carry the test and eval stack, which means CI has to ask for it explicitly.
      - name: Install project dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Fixtures are committed, but regenerating proves make_fixtures.py still runs and
      # that its built-in arithmetic assertions hold. Synthetic data only — no real
      # financial documents exist in this repository (rules.md Rule 4).
      - name: Generate synthetic fixtures
        run: python scripts/make_fixtures.py

      - name: Run offline test suite
        # The suite passes with no credential at all — verified locally by unsetting the
        # variable. This dummy value is belt-and-braces so a future test that reads the
        # environment during import cannot fail on a missing key.
        #
        # Trade-off worth knowing: any non-placeholder value makes `groq_configured`
        # return True, so a future test that reaches a real client would attempt a live
        # call and fail with an auth error rather than skipping. If that becomes a
        # nuisance, drop this env block — CI does not need it today.
        env:
          GROQ_API_KEY: gsk_dummy_key_for_ci_testing_only
        run: pytest -v --durations=10

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Next.js 16 requires Node >= 20.9.0 (declared in its package.json engines field).
      # 22 is the current LTS and comfortably above that floor.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # The lockfile is not at the repository root, so the cache key needs an
          # explicit path — without it the cache silently never hits.
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly what the committed
      # lockfile pins and fails if package.json and the lockfile have drifted apart,
      # which is the behaviour a build should have.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Catches TypeScript errors as well as build failures — `next build` runs tsc.
      - name: Build
        run: npm run build
        env:
          # The build prerenders the page, and the client reads this at module scope.
          # It is a build-time default only; the running app talks to whatever the
          # deployed environment sets.
          NEXT_PUBLIC_API_BASE: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"
