[pytest]
testpaths = tests
python_files = test_*.py

; Put the project root on sys.path so `import src` resolves.
;
; Without this, only `python -m pytest` works — that form implicitly prepends the current
; directory — while a bare `pytest` fails at collection with ModuleNotFoundError. CI runs
; the bare form, which is how the gap surfaced. Setting it here fixes both invocations on
; every machine rather than papering over it with PYTHONPATH in the workflow alone.
pythonpath = .
; Integration tests hit the live Groq API. Excluded by default so the standard run is
; free and offline (rules.md Rule 1 + 2.4). Run them with:  pytest -m integration
addopts = -q --strict-markers -m "not integration"
markers =
    slow: exercises real Docling conversion (~20s model load, first test only)
    integration: hits a live external API; excluded from the default free/offline run
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
