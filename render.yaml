# Render deployment for the FastAPI backend (api.py).
#
# Only the Python backend is described here. The Next.js app in frontend/ is a separate
# service; set ALLOWED_ORIGINS below to its origin or the browser blocks every call it
# makes.
#
# Free tier, deliberately — rules.md Rule 1. Two consequences to plan around rather than
# discover in production:
#
#   RAM.  512 MB, against a process that holds torch, a Docling layout model and MiniLM
#         resident. api.py's lifespan hook loads all three at boot so the first request
#         does not pay for it, which means the ceiling is hit during startup rather than
#         under load. If the service dies while booting with no error of its own, this is
#         the reason. The ways out are a larger instance, or deferring the model load and
#         accepting a slow first request.
#   DATA. No disk, so data/ is ephemeral. Uploads, the Chroma store and the LLM cache are
#         wiped on every deploy and every restart — and a free instance spins down after
#         inactivity, so restarts are routine, not rare. Documents have to be re-uploaded
#         after each one, and the ~500 MB of Docling and MiniLM weights are re-downloaded
#         on every cold boot.

services:
  - type: web
    name: finlens-api
    runtime: python
    plan: free
    region: oregon

    # torch is installed separately and first, from the CPU index. A plain
    # `pip install torch` on Linux resolves to the CUDA build and drags in ~2.5 GB of
    # libraries this CPU-only service will never call — requirements.txt carries the same
    # instruction for local installs, and the build fails on size without it.
    buildCommand: |
      pip install --upgrade pip
      pip install torch --index-url https://download.pytorch.org/whl/cpu
      pip install -r requirements.txt

    # Single worker, deliberately. api.py keeps parsed documents in an in-process dict, so
    # a second worker would hold its own copy and uploads would appear to vanish between
    # requests; the embedded Chroma store is single-process regardless (decision D-34).
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT --workers 1

    # Returns degraded rather than failing when Groq is unreachable, so it answers during
    # a provider outage instead of pulling the service out of rotation.
    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      # Required. Free tier, no credit card. sync:false keeps it out of the repo — set it
      # in the Render dashboard.
      - key: GROQ_API_KEY
        sync: false

      # The deployed frontend's origin, comma-separated for more than one. Without this
      # the API keeps its localhost default and the browser blocks every call from the
      # deployed UI. A wildcard is rejected at startup — see src/config.py.
      - key: ALLOWED_ORIGINS
        sync: false

      # Optional tracing. The app runs normally without these (decision D-11).
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      - key: LANGCHAIN_API_KEY
        sync: false
